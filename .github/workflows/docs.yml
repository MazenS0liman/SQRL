  name: Build & Deploy Docs to GitHub Pages

  on:
    push:
      branches: ["main"]
      paths:
        - "**/*.py"
        - "backend/docs/**"
        - "backend/generate_docs.ps1"
    workflow_dispatch:

  permissions:
    contents: read
    pages: write
    id-token: write

  concurrency:
    group: "pages"
    cancel-in-progress: false

  jobs:
    build-and-deploy:
      runs-on: windows-latest

      environment:
        name: github-pages
        url: ${{ steps.deploy.outputs.page_url }}

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"
            cache: "pip"
            cache-dependency-path: backend/requirements.txt

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install -r backend/requirements.txt
            python -m pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints sphinx-copybutton
          shell: pwsh

        - name: Install package
          run: python -m pip install -e backend
          shell: pwsh

        - name: Build documentation
          run: ./backend/generate_docs.ps1
          shell: pwsh

        - name: Create .nojekyll file
          run: New-Item -Path "backend/docs/_build/html/.nojekyll" -ItemType File -Force
          shell: pwsh

        - name: Setup Pages
          uses: actions/configure-pages@v5

        - name: Upload docs artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: backend/docs/_build/html

        - name: Deploy to GitHub Pages
          id: deploy
          uses: actions/deploy-pages@v4
