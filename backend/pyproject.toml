[project]
name = "squirrel"
version = "0.1.0"
description = ""
authors = [
    {name = "mazen", email = "mazen.sayed.soliman@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0.0"
dependencies = [
    "requests>=2.34.2,<3.0.0",
    "typing-extensions>=4.15.0,<5.0.0",
    "python-dotenv>=1.0.0",
    "google>=3.0.0,<4.0.0",
    "google-genai>=2.7.0,<3.0.0",
    "instructor>=1.15.1,<2.0.0",
    "loguru>=0.7.3,<0.8.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "toml>=0.10.2,<0.11.0",
    "fastapi[standard]>=0.115.0,<0.116.0",
    "minio>=7.2.20,<8.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "numpy>=1.24.1,<1.26.0",
    "scikit-learn>=1.3.0,<1.6.0",
    "gunicorn>=23.0.0,<24.0.0",
    "uvicorn[standard]>=0.27.0",
    "fsspec (>=2026.4.0,<2027.0.0)",
    "boto3 (>=1.43.29,<2.0.0)",
    "groq (>=1.4.0,<2.0.0)",
    "huggingface-hub (>=1.19.0,<2.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "uvicorn-worker (>=0.4.0,<0.5.0)",
    "xgboost (<3)",
    "lightgbm (>=4.6.0,<5.0.0)",
    "pandas (>=2.0.0)",
    "matplotlib (<3.11)",
    "cryptography (>=50.0.0,<51.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "squirrel" }]

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
