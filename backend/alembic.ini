# Alembic configuration for the SQRL backend.
#
# Run from the backend directory:
#     alembic upgrade head
#
# The database URL is read from DATABASE_URL / POSTGRES_DSN via
# squirrel.core.config in migrations/env.py, so it does not live here.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

# Alembic logs through the standard logging module; the application itself uses
# loguru, so this section only controls migration output.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
